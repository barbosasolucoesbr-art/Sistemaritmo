const $=s=>document.querySelector(s);const dayKey=(date)=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;const parseDay=k=>new Date(k+'T12:00:00');const today=()=>dayKey(new Date());const daysShift=(k,n)=>{let d=parseDay(k);d.setDate(d.getDate()+n);return dayKey(d)};

let page='home',date=today(),programChoice=null,expandedExercise=0,modal=null,toastTimer=null,days={},settings=structuredClone(DEFAULT_SETTINGS),db=null,fallback=false,ready=false;
function freshDay(k){return {date:k,water:0,meals:[],meds:{},workouts:{},weight:'',waist:'',bowel:null,habits:{}}}

async function initStore(){if(!('indexedDB'in window)){fallback=true;return}try{db=await new Promise((resolve,reject)=>{const req=indexedDB.open('ritmo-saude-v1',1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('days'))db.createObjectStore('days',{keyPath:'date'});if(!db.objectStoreNames.contains('config'))db.createObjectStore('config',{keyPath:'key'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(new Error('Banco bloqueado'))});const [d,c]=await Promise.all([readAll('days'),readAll('config')]);days=Object.fromEntries(d.map(x=>[x.date,x]));const s=c.find(x=>x.key==='settings');if(s)settings=normalizeSettings(s.value)}catch(e){console.warn('IndexedDB indisponível',e);db=null;fallback=true;try{const st=JSON.parse(localStorage.getItem('ritmo-fallback')||'{}');days=st.days||{};settings=normalizeSettings(st.settings||DEFAULT_SETTINGS)}catch{}}}
function normalizeSettings(s){const v={...structuredClone(DEFAULT_SETTINGS),...(s||{})};if(!Array.isArray(v.medications))v.medications=structuredClone(MEDS);v.waterGoal=clamp(Number(v.waterGoal)||2500,250,6000);v.trainingMode=v.trainingMode==='original'?'original':'retorno';return v}
function readAll(name){return new Promise((resolve,reject)=>{const q=db.transaction(name,'readonly').objectStore(name).getAll();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function saveInStore(name,obj){return new Promise((resolve,reject)=>{const t=db.transaction(name,'readwrite');t.objectStore(name).put(obj);t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error)})}
async function saveAllFallback(){try{localStorage.setItem('ritmo-fallback',JSON.stringify({days,settings}))}catch{notify('O armazenamento está cheio. Faça um backup!')}}

function notify(msg){const root=$('#toast-root');clearTimeout(toastTimer);root.innerHTML=`<div role="status" class="toast">${esc(msg)}</div>`;toastTimer=setTimeout(()=>root.innerHTML='',3300)}

function homePage(){const r=getDay(),p=completion(r),meds=medCount(r),ml=Math.round(r.water/1000*10)/10;return `${header()}<div class="eyebrow">SEU DIÁRIO DE BEM-ESTAR</div><h1 class="page-title">Um dia de cada vez.</h1><p class="subtitle">Rotina simples, evolução constante. ${date===today()?'Hoje é um bom dia para cuidar de você.':'Visualizando seu registro anterior ou futuro.'}</p>${dateNav()}<div class="hero"><div class="hero-label">${esc(fmtDate(date))}</div><div class="hero-title">Seu cuidado vira resultado.</div><div class="hero-sub">Um dia por vez, com saúde e constância.</div><div class="mini-goal">${ic('activity','sm')} Plano até junho de 2027</div><div class="mark"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="#41675a" stroke-width="9"/><circle cx="60" cy="60" r="50" fill="none" stroke="#d5ef91" stroke-width="9" stroke-linecap="round" stroke-dasharray="${Math.round(314*p/100)} 314" transform="rotate(-90 60 60)"/></svg><div class="score"><strong>${p}%</strong><span>do dia</span></div></div></div>${section('Seu dia','<span class="hint">Tudo no seu ritmo</span>')}<div class="stat-grid">${stat('water',ml.toLocaleString('pt-BR')+' L','Água registrada')}${stat('food',r.meals.length,'Refeições anotadas')}${stat('pill',meds+'/'+settings.medications.length,'Medicamentos')}${stat('dumbbell',workoutDone(r)?'Feito':'—','Treino do dia')}</div>${section('Hidratação','<span class="hint">Meta editável</span>')}${waterCard(r)}${section('Medicamentos',`<button class="subtle-link" data-action="page" data-page="settings">Gerenciar</button>`)}${medCard(r)}${section('Alimentação',`<button class="subtle-link" data-action="page" data-page="food">Abrir diário ${ic('chevronRight','sm')}</button>`)}${mealCard(r)}${section('Pequenas vitórias','<span class="hint">Marque as que cumpriu</span>')}${habitCard(r)}<div class="info-box mt20">${ic('info','sm')} O registro de medicamentos não substitui sua receita nem emite alertas quando o app está fechado. Horários inseridos conforme você informou.</div>`}

function medCard(r){return `<div class="card">${settings.medications.map(m=>`<div class="med-row"><div class="med-time">${esc(m.time)}</div><div class="med-bubble">${ic('pill')}</div><div class="med-info"><strong>${esc(m.name)}</strong><small>${esc(m.dose)} · ${m.type==='supplement'?'Suplemento autorizado':'Prescrição informada'}</small></div><button class="tiny-check ${r.meds?.[m.id]?'done':''}" data-action="med" data-id="${esc(m.id)}">${ic('check')} ${r.meds?.[m.id]?'Tomado':'Marcar'}</button></div>`).join('')}<div class="small-note mt16">Marcar confirma apenas o que você realmente tomou. Se esquecer uma dose, não tome em dobro por causa do app.</div></div>`}

function foodPage(){const r=getDay();return `${header()}<div class="eyebrow">COMER BEM SEM PASSAR MAL</div><h1 class="page-title">Alimentação</h1><p class="subtitle">Marmitas simples, registro das refeições e diário digestivo.</p>${dateNav()}<div class="info-box green">${ic('check','sm')} Você costuma tolerar bem refeições simples. Na primeira quinzena, evite os molhos que já provocam desconforto e acompanhe como seu intestino reage.</div>${section('Registro do dia',`<button class="subtle-link" data-action="open-meal">+ Nova refeição</button>`)}${mealCard(r)}${section('Sintomas intestinais','<span class="hint">Registre sem julgamento</span>')}<div class="card"><div class="card-head"><h3>Como esteve seu intestino?</h3><button class="subtle-link" data-action="open-bowel">Editar</button></div><p class="subtitle m0 mt8">${r.bowel?`<strong style="color:var(--ink)">${esc(r.bowel.status)}</strong> · ${esc(r.bowel.description||'Sem detalhes')}`:'Sem registro neste dia.'}</p></div>${section('Marmitas da semana','<span class="hint">Referências iniciais</span>')}<div class="card">${MEAL_PLAN.map((m,i)=>`<div class="meal-suggestion"><div class="meal-day-icon">${ic('food','sm')}</div><div><strong>${m[0]}</strong><p>${m[1]}</p></div></div>`).join('')}</div><div class="info-box mt16">Priorize preparações cozidas ou grelhadas e sem maionese, molhos gordurosos ou lactose. Considere avaliação com gastroenterologista se a diarreia for recorrente, mesmo com gatilhos conhecidos.</div>`}
function weightChart(){const vals=Object.values(days).filter(x=>x&&typeof x.date==='string'&&x.weight!==undefined&&x.weight!==''&&Number.isFinite(Number(String(x.weight).replace(',','.')))).map(x=>({d:x.date,v:Number(String(x.weight).replace(',','.'))})).filter(x=>x.v>=30&&x.v<=300).sort((a,b)=>a.d.localeCompare(b.d));if(vals.length<2)return `<div class="empty-note">Registre seu peso em pelo menos dois dias para visualizar a tendência.</div>`;const a=vals.slice(-15),min=Math.min(...a.map(x=>x.v))-1,max=Math.max(...a.map(x=>x.v))+1,span=max-min||1;const pts=a.map((x,i)=>({x:20+i/(a.length-1)*290,y:118-((x.v-min)/span)*92,v:x.v,d:x.d}));const path=pts.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');return `<svg viewBox="0 0 330 145" role="img" aria-label="Histórico de peso, de ${a[0].v} a ${a[a.length-1].v} quilos" style="width:100%;height:145px"><path d="M20 118H310" stroke="#e9eee9" stroke-width="2"/><path d="${path}" fill="none" stroke="#2b7359" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3.3" fill="#2b7359"/>`).join('')}<text x="20" y="139" fill="#8c9a91" font-size="10">${a[0].v.toLocaleString('pt-BR')} kg</text><text x="310" y="139" text-anchor="end" fill="#397359" font-size="10">${a[a.length-1].v.toLocaleString('pt-BR')} kg</text></svg>`}
function progressPage(){const r=getDay(),end=date,range=Array.from({length:7},(_,i)=>daysShift(end,i-6)),waterReached=range.filter(d=>getDay(d).water>=settings.waterGoal).length,trained=range.filter(d=>workoutDone(getDay(d))).length,medAdhered=range.filter(d=>{const rr=getDay(d);return settings.medications.length>0&&medCount(rr)===settings.medications.length}).length;const todayStr=today();const last28=Array.from({length:28},(_,i)=>daysShift(todayStr,i-27));return `${header()}<div class="eyebrow">SUA JORNADA</div><h1 class="page-title">Evolução</h1><p class="subtitle">Acompanhe hábitos, medidas e consistência — sem se prender só à balança.</p>${dateNav()}<div class="stat-grid">${stat('dumbbell',trained,'Treinos · últimos 7 dias')}${stat('water',waterReached+'/7','Meta de água atingida')}${stat('pill',medAdhered+'/7','Dias com registros completos')}${stat('activity',Object.values(days).filter(x=>workoutDone(x)).length,'Treinos acumulados')}</div>${section('Seu peso e cintura','<span class="hint">Atualize quando medir</span>')}<div class="card"><div class="form-grid"><div><label class="form-label" for="weight">Peso (kg)</label><input class="field" id="weight" inputmode="decimal" placeholder="Ex.: 87,0" value="${esc(r.weight)}" data-field="weight"></div><div><label class="form-label" for="waist">Cintura (cm)</label><input class="field" id="waist" inputmode="decimal" placeholder="Ex.: 100" value="${esc(r.waist)}" data-field="waist"></div></div><div class="small-note mt12">Os valores são salvos quando você sai do campo. Meça a cintura no mesmo ponto e horário, de preferência uma vez por semana.</div></div>${section('Histórico de peso','<span class="hint">Últimas medições</span>')}<div class="card">${weightChart()}</div>${section('Água nos últimos 7 dias','<span class="hint">ml por dia</span>')}<div class="card"><div class="chart">${range.map(k=>{const rr=getDay(k),height=clamp(Math.round((rr.water/(settings.waterGoal||2500))*91),3,95);return `<div class="chart-col"><div class="chartbar ${rr.water?'':'low'}" style="height:${height}%" title="${k}: ${rr.water} ml"></div><small>${parseDay(k).toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}</small></div>`}).join('')}</div><p class="small-note m0 mt16">Meta diária atual: ${settings.waterGoal.toLocaleString('pt-BR')} ml. Ajuste conforme orientação e condições de saúde.</p></div>${section('Calendário de treinos','<span class="hint">Últimos 28 dias</span>')}<div class="card"><div class="calendar">${last28.map(k=>`<button class="cal-cell ${workoutDone(getDay(k))?'trained':''} ${k===todayStr?'today':''}" data-action="select-day" data-day="${k}" title="${k}">${Number(k.slice(-2))}</button>`).join('')}</div><div class="small-note mt12"><span style="color:var(--brand)">■</span> Dia com treino concluído · toque para ver o registro.</div></div>${section('Hábitos no período','<span class="hint">Últimos 7 dias</span>')}<div class="card">${HABITS.map(([id,label])=>{const count=range.filter(k=>getDay(k).habits?.[id]).length;return `<div class="setting-row"><div><strong>${label}</strong><small>${count} dos últimos 7 dias marcados</small></div><span class="pill">${count}/7</span></div>`}).join('')}</div>`}
function settingsPage(){return `${header()}<div class="eyebrow">PERSONALIZE SUA ROTINA</div><h1 class="page-title">Ajustes</h1><p class="subtitle">Configure suas metas, seus horários e seus dados pessoais.</p>${section('Metas e treinamento')}<div class="card"><div class="setting-row"><div><strong>Meta de água</strong><small>Valor inicial sugerido, ajustável</small></div><input aria-label="Meta diária de água em mililitros" class="field" style="width:104px" inputmode="numeric" type="number" min="250" max="6000" step="50" value="${settings.waterGoal}" data-field="goal"></div><div class="setting-row"><div><strong>Modo de treino</strong><small>Retomada: menos séries por exercício</small></div><select class="field" data-field="trainingMode"><option value="retorno" ${settings.trainingMode==='retorno'?'selected':''}>Retomada</option><option value="original" ${settings.trainingMode==='original'?'selected':''}>Original</option></select></div></div>${section('Medicamentos e suplementos')}<div class="card">${settings.medications.map(m=>`<div class="setting-row"><div style="flex:1"><strong>${esc(m.name)} · ${esc(m.dose)}</strong><small>${m.type==='supplement'?'Suplemento validado por profissional':'Seu tratamento informado'}</small></div><input class="field" aria-label="Horário de ${esc(m.name)}" style="width:110px" type="time" value="${esc(m.time)}" data-field="med-time" data-id="${esc(m.id)}">${m.type==='supplement'?`<button class="round-btn" aria-label="Excluir suplemento" style="width:32px;height:32px" data-action="delete-supp" data-id="${esc(m.id)}">${ic('trash','sm')}</button>`:''}</div>`).join('')}<button class="btn secondary full mt16" data-action="open-supp">${ic('plus','sm')} Adicionar suplemento autorizado</button></div><div class="info-box mt12">Não incluí vitaminas ou suplementos sem indicação clínica. Cadastre seus medicamentos e respectivos horários apenas no seu aparelho, conforme orientação do prescritor. Nenhum medicamento ou dose pessoal fica exposto no código do site.</div>${section('Dados e privacidade')}<div class="card"><div class="setting-row"><div><strong>Exportar backup</strong><small>Arquivo JSON com seus registros, inclusive dados de saúde</small></div><button class="round-btn" data-action="export" aria-label="Exportar backup">${ic('download')}</button></div><div class="setting-row"><div><strong>Importar backup</strong><small>Restaura seus dados e substitui os atuais</small></div><button class="round-btn" data-action="import" aria-label="Importar backup">${ic('upload')}</button></div><div class="setting-row"><div><strong>Apagar registros</strong><small>Exclui dados salvos neste dispositivo</small></div><button class="round-btn" data-action="reset" aria-label="Apagar todos os registros">${ic('trash')}</button></div></div><div class="info-box mt12">${ic('info','sm')} Seus dados ficam no IndexedDB do navegador/aparelho (ou armazenamento local de reserva). Não existe servidor ou sincronização com outro iPhone nesta versão. Exporte backups regularmente: limpar dados do site ou remover o app pode apagar seus registros.</div>${section('Instalar no iPhone')}<button class="btn secondary full" data-action="install-help">${ic('plusCircle','sm')} Como adicionar à Tela de Início</button><div class="small-note mt16">Ritmo v1.0 · PWA offline · Sem anúncios · Sem conta · Feito para acompanhamento pessoal, não para decisão médica.</div>`}
function symptomLabel(s){return ({nenhum:'Sem sintomas',leve:'Leve desconforto',diarreia:'Diarreia',forte:'Desconforto forte'})[s]||'Sem avaliação'}
function modalHtml(){if(!modal)return '';const close=`<button class="sheet-close" data-action="close-modal" aria-label="Fechar">${ic('close','sm')}</button>`;let title='',body='';
if(modal==='meal'){title='Registrar refeição';body=`<div class="field-wrap"><label class="form-label" for="meal-title">O que você comeu?</label><input id="meal-title" class="field" placeholder="Ex.: arroz, frango e cenoura" maxlength="200"></div><div class="form-grid"><div class="field-wrap"><label class="form-label" for="meal-type">Refeição</label><select id="meal-type" class="field"><option>Café da manhã</option><option>Almoço</option><option>Lanche</option><option>Jantar</option><option>Ceia</option></select></div><div class="field-wrap"><label class="form-label" for="meal-time">Horário</label><input type="time" id="meal-time" class="field" value="${fmtTime()}"></div></div><div class="field-wrap"><label class="form-label">Como se sentiu depois?</label><select id="meal-symptom" class="field"><option value="nenhum">Sem sintomas</option><option value="leve">Desconforto leve</option><option value="diarreia">Diarreia</option><option value="forte">Desconforto forte</option></select></div><div class="field-wrap"><label class="form-label" for="meal-notes">Observações (opcional)</label><textarea class="field" id="meal-notes" rows="2" placeholder="Molho, lactose, tempo até o desconforto..."></textarea></div><button class="btn full" data-action="save-meal">${ic('check','sm')} Salvar refeição</button>`}
else if(modal==='bowel'){const b=getDay().bowel;title='Registro intestinal';body=`<div class="field-wrap"><label class="form-label">Como esteve seu intestino?</label><select class="field" id="bowel-status">${['Normal','Gases ou estufamento','Fezes amolecidas','Diarreia','Constipação','Não evacuei'].map(s=>`<option ${b?.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field-wrap"><label class="form-label">Observações</label><textarea id="bowel-notes" class="field" rows="3" placeholder="Quando começou, quantas vezes, que alimentos comeu...">${esc(b?.description||'')}</textarea></div><button class="btn full" data-action="save-bowel">${ic('check','sm')} Salvar registro</button>`}
else if(modal==='supp'){title='Suplemento autorizado';body=`<div class="info-box mb12">Adicione apenas suplementos ou vitaminas que já tenham sido orientados ou validados por seu profissional de saúde. Não iniciamos nenhuma vitamina automaticamente.</div><div class="field-wrap"><label class="form-label">Nome do suplemento</label><input class="field" id="supp-name" maxlength="90" placeholder="Ex.: vitamina prescrita"></div><div class="form-grid"><div class="field-wrap"><label class="form-label">Dose</label><input class="field" id="supp-dose" maxlength="30" placeholder="Ex.: 1 cápsula"></div><div class="field-wrap"><label class="form-label">Horário</label><input class="field" id="supp-time" type="time" value="12:00"></div></div><label class="flex tiny-text mb12"><input id="supp-confirm" type="checkbox"> Foi orientado ou validado por profissional de saúde</label><button class="btn full" data-action="save-supp">${ic('check','sm')} Adicionar ao controle</button>`}
else if(modal==='install'){title='Instalar no iPhone';body=`<p class="subtitle">Para aparecer como aplicativo com ícone próprio, publique a pasta do projeto em um endereço HTTPS. Depois:</p><div class="card"><div class="meal-suggestion"><div class="ex-num">1</div><div><strong>Abra o endereço no Safari</strong><p>Não basta abrir o arquivo HTML pelo aplicativo Arquivos.</p></div></div><div class="meal-suggestion"><div class="ex-num">2</div><div><strong>Toque em Compartilhar</strong><p>Escolha a opção “Adicionar à Tela de Início”.</p></div></div><div class="meal-suggestion"><div class="ex-num">3</div><div><strong>Selecione “Abrir como App”</strong><p>Se a opção aparecer, ative e toque em Adicionar.</p></div></div></div><div class="info-box mt12">Registros ficam somente neste aparelho. O app funciona offline depois de aberto e carregado pelo menos uma vez.</div>`}
return `<div class="modal-backdrop" data-action="close-backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-bar"></div><div class="sheet-head"><h3>${esc(title)}</h3>${close}</div>${body}</div></div>`}
function render(){if(!ready)return;const pages={home:homePage,workout:workoutPage,food:foodPage,progress:progressPage,settings:settingsPage};$('#view').innerHTML=pages[page]();const tabs=[['home','Hoje','home'],['workout','Treinos','dumbbell'],['food','Refeições','food'],['progress','Evolução','chart'],['settings','Ajustes','settings']];$('#nav').innerHTML=tabs.map(([id,label,icon])=>`<button class="nav-btn ${page===id?'active':''}" data-action="page" data-page="${id}" aria-current="${page===id?'page':'false'}">${ic(icon)}<span>${label}</span>${page===id?'<span class="nav-dot"></span>':''}</button>`).join('');$('#modal-root').innerHTML=modalHtml()}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'})}
function workingSession(pid){let r=safeDay();let w=r.workouts[pid];if(!w)w={startedAt:new Date().toISOString(),finishedAt:null,sets:{}};w.sets=w.sets||{};return {r,w}}
async function act(name,el){let r=safeDay();const id=el.dataset.id,pid=el.dataset.program;
switch(name){case 'page':page=el.dataset.page;modal=null;if(page==='workout')programChoice=null;scrollTop();break;
case 'prev-date':date=daysShift(date,-1);programChoice=null;scrollTop();break;case 'next-date':date=daysShift(date,1);programChoice=null;scrollTop();break;case 'go-today':date=today();programChoice=null;scrollTop();break;case 'select-day':date=el.dataset.day;page='home';scrollTop();break;
case 'water':r.water=Math.max(0,r.water+Number(el.dataset.amount));await saveDay(r);break;
case 'med':r.meds[id]?delete r.meds[id]:r.meds[id]={takenAt:new Date().toISOString()};await saveDay(r);break;
case 'habit':r.habits[id]=!r.habits[id];await saveDay(r);break;
case 'open-meal':modal='meal';break;case 'open-bowel':modal='bowel';break;case 'open-supp':modal='supp';break;case 'install-help':modal='install';break;
case 'close-modal':modal=null;break;
case 'close-backdrop':if(el===el.ownerDocument.querySelector('.modal-backdrop'))modal=null;break;
case 'save-meal':{const title=$('#meal-title')?.value.trim();if(!title){notify('Escreva o que você comeu.');return}r.meals.push({id:'meal-'+Date.now(),title,type:$('#meal-type').value,time:$('#meal-time').value,symptom:$('#meal-symptom').value,notes:$('#meal-notes').value.trim()});await saveDay(r);modal=null;notify('Refeição registrada.');break}
case 'delete-meal':if(confirm('Excluir esta refeição?')){r.meals=r.meals.filter(m=>m.id!==id);await saveDay(r)}break;
case 'save-bowel':r.bowel={status:$('#bowel-status').value,description:$('#bowel-notes').value.trim(),loggedAt:new Date().toISOString()};await saveDay(r);modal=null;notify('Sintomas registrados.');break;
case 'program':programChoice=el.dataset.program;expandedExercise=0;break;
case 'expand-exercise':expandedExercise=expandedExercise===Number(el.dataset.index)?-1:Number(el.dataset.index);break;
case 'start-workout':{const {r:rr,w}=workingSession(pid);rr.workouts[pid]=w;await saveDay(rr);expandedExercise=0;notify('Treino iniciado.');break}
case 'finish-workout':{const {r:rr,w}=workingSession(pid);w.finishedAt=w.finishedAt?null:new Date().toISOString();rr.workouts[pid]=w;await saveDay(rr);notify(w.finishedAt?'Treino concluído!':'Treino reaberto.');break}
case 'set-done':{const {r:rr,w}=workingSession(pid);const ex=Number(el.dataset.ex),s=Number(el.dataset.set),p=PROGRAMS.find(x=>x.id===pid);if(!p)return;const a=w.sets[ex]||[];a[s]=a[s]||{reps:p.ex[ex][2],kg:'',done:false};a[s].done=!a[s].done;w.sets[ex]=a;rr.workouts[pid]=w;await saveDay(rr);break}
case 'save-supp':{const name=$('#supp-name')?.value.trim(),dose=$('#supp-dose')?.value.trim(),time=$('#supp-time')?.value;if(!name||!dose||!time){notify('Preencha todos os campos.');return}if(!$('#supp-confirm').checked){notify('Confirme a orientação profissional.');return}settings.medications.push({id:'supp-'+Date.now(),name,dose,time,type:'supplement'});await saveSettings();modal=null;notify('Suplemento adicionado.');break}
case 'delete-supp':if(confirm('Remover este suplemento do seu controle?')){settings.medications=settings.medications.filter(x=>x.id!==id);await saveSettings();notify('Suplemento removido.')}break;
case 'export':await exportBackup();break;case 'import':$('#import-file').click();return;case 'reset':await resetData();break;
}render()}
async function onChange(el){let field=el.dataset.field;if(!field)return;let r=safeDay();if(field==='weight'||field==='waist'){r[field]=el.value.replace(',','.').slice(0,20);await saveDay(r);notify('Medida salva.');return}if(field==='goal'){settings.waterGoal=clamp(Number(el.value)||2500,250,6000);await saveSettings();render();return}if(field==='trainingMode'){settings.trainingMode=el.value==='original'?'original':'retorno';await saveSettings();render();return}if(field==='med-time'){const m=settings.medications.find(m=>m.id===el.dataset.id);if(m){m.time=el.value||m.time;await saveSettings();notify('Horário atualizado.');}return}if(field==='set-kg'||field==='set-reps'){const pid=el.dataset.program,ex=Number(el.dataset.ex),s=Number(el.dataset.set),p=PROGRAMS.find(x=>x.id===pid);if(!p)return;const {r:rr,w}=workingSession(pid);const a=w.sets[ex]||[];a[s]=a[s]||{reps:p.ex[ex][2],kg:'',done:false};if(field==='set-kg')a[s].kg=el.value.slice(0,20);else a[s].reps=el.value.slice(0,30);w.sets[ex]=a;rr.workouts[pid]=w;await saveDay(rr);return}}
async function exportBackup(){const content={app:'ritmo-pwa',version:1,exportedAt:new Date().toISOString(),settings,days};const blob=new Blob([JSON.stringify(content,null,2)],{type:'application/json'});const file=new File([blob],`ritmo-backup-${today()}.json`,{type:'application/json'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Backup Ritmo'});notify('Backup enviado para compartilhamento.');return}}catch(e){if(e.name==='AbortError')return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('Backup gerado. Salve no app Arquivos.');}
async function resetData(){if(!confirm('Apagar todos os registros do Ritmo neste aparelho?'))return;if(!confirm('Confirma a exclusão? Exporte um backup antes, se necessário.'))return;if(db){await Promise.all(['days','config'].map(n=>new Promise((resolve,reject)=>{const t=db.transaction(n,'readwrite');t.objectStore(n).clear();t.oncomplete=resolve;t.onerror=()=>reject(t.error)})))}else{localStorage.removeItem('ritmo-fallback')}days={};settings=structuredClone(DEFAULT_SETTINGS);date=today();page='home';notify('Registros apagados.');}
$('#import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{const data=JSON.parse(await file.text());if(data.app!=='ritmo-pwa'||data.version!==1||!data.days||typeof data.days!=='object'||!data.settings)throw Error('Arquivo inválido.');if(!confirm('Importar este backup? Ele substituirá seus registros atuais.'))return;const incoming=Object.values(data.days).filter(x=>x&&typeof x==='object'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date||''));if(db){await Promise.all(['days','config'].map(n=>new Promise((resolve,reject)=>{const t=db.transaction(n,'readwrite');t.objectStore(n).clear();t.oncomplete=resolve;t.onerror=()=>reject(t.error)})))}days=Object.fromEntries(incoming.map(x=>[x.date,x]));settings=normalizeSettings(data.settings);for(const r of incoming)await saveDay(r);await saveSettings();date=today();page='home';render();notify('Backup restaurado com sucesso.')}catch(err){console.error(err);notify('Não foi possível importar esse arquivo.')}});
document.addEventListener('click',async ev=>{const el=ev.target.closest('[data-action]');if(!el)return;if(el.classList.contains('modal-backdrop')&&ev.target!==el)return;ev.preventDefault();await act(el.dataset.action,el)});
document.addEventListener('change',async ev=>{if(ev.target.dataset.field)await onChange(ev.target)});
async function init(){await initStore();ready=true;render();if('serviceWorker'in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(e=>console.warn('Offline indisponível',e))}if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});}
init().catch(err=>{console.error(err);$('#view').innerHTML='<h2>Não foi possível iniciar o app.</h2><p>Recarregue a página e tente novamente.</p>'});
})();
</script>
</body>
